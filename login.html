<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | SCHOOL HUB Vs Amexo</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        :root {
            --primary: #2563eb;
            --secondary: #7c3aed;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --muted: #64748b;
            --border: #e2e8f0;
            --danger: #dc2626;
            --success: #16a34a;
        }

        body.dark {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: #334155;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at 10% 10%,
                    #dbeafe 0,
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 90%,
                    #ede9fe 0,
                    transparent 30%
                ),
                var(--bg);

            color: var(--text);

            display: flex;
            flex-direction: column;

            transition: .3s;
        }

        /* ================= HEADER ================= */

        header {
            height: 72px;

            background: var(--card);

            border-bottom:
                1px solid var(--border);
        }

        .navbar {
            max-width: 1200px;
            height: 100%;

            margin: auto;
            padding: 0 20px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;

            text-decoration: none;
            color: var(--text);

            font-weight: 800;
        }

        .logo-icon {
            width: 42px;
            height: 42px;

            border-radius: 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--secondary)
                );
        }

        .logo-name span {
            color: var(--primary);
        }

        .logo-name small {
            display: block;

            font-size: 9px;

            color: var(--muted);

            letter-spacing: .5px;
        }

        .home-link {
            text-decoration: none;

            color: var(--muted);

            font-size: 14px;
            font-weight: 600;
        }

        .home-link:hover {
            color: var(--primary);
        }

        /* ================= MAIN ================= */

        main {
            flex: 1;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 40px 20px;
        }

        .login-card {
            width: 100%;
            max-width: 470px;

            background: var(--card);

            border: 1px solid var(--border);

            border-radius: 24px;

            padding: 45px;

            box-shadow:
                0 25px 70px
                rgba(15, 23, 42, .12);
        }

        /* ================= LOGIN HEADER ================= */

        .login-heading {
            text-align: center;

            margin-bottom: 30px;
        }

        .login-icon {
            width: 65px;
            height: 65px;

            margin: 0 auto 18px;

            border-radius: 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 28px;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--secondary)
                );
        }

        .login-heading h1 {
            font-size: 30px;

            margin-bottom: 7px;
        }

        .login-heading p {
            color: var(--muted);

            font-size: 14px;
        }

        /* ================= FORM ================= */

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;

            font-size: 13px;

            font-weight: 700;

            margin-bottom: 7px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;

            left: 14px;
            top: 50%;

            transform:
                translateY(-50%);

            font-size: 16px;

            opacity: .7;
        }

        input {
            width: 100%;
            height: 50px;

            border: 1px solid var(--border);

            border-radius: 10px;

            background: var(--bg);

            color: var(--text);

            padding:
                0 45px;

            outline: none;

            transition: .2s;
        }

        input:focus {
            border-color:
                var(--primary);

            box-shadow:
                0 0 0 3px
                rgba(37,99,235,.1);
        }

        .password-toggle {
            position: absolute;

            right: 12px;
            top: 50%;

            transform:
                translateY(-50%);

            border: none;

            background: transparent;

            color: var(--muted);

            cursor: pointer;
        }

        /* ================= OPTIONS ================= */

        .options {
            display: flex;

            justify-content:
                space-between;

            align-items: center;

            margin: 8px 0 20px;
        }

        .remember {
            display: flex;

            align-items: center;

            gap: 7px;

            color: var(--muted);

            font-size: 12px;
        }

        .remember input {
            width: auto;
            height: auto;

            accent-color:
                var(--primary);
        }

        .forgot {
            color: var(--primary);

            font-size: 12px;

            font-weight: 700;

            text-decoration: none;
        }

        /* ================= BUTTON ================= */

        .login-btn {
            width: 100%;
            height: 50px;

            border: none;

            border-radius: 10px;

            color: white;

            font-size: 15px;

            font-weight: 800;

            cursor: pointer;

            background:
                linear-gradient(
                    90deg,
                    var(--primary),
                    var(--secondary)
                );

            transition: .2s;
        }

        .login-btn:hover {
            transform:
                translateY(-1px);

            box-shadow:
                0 10px 25px
                rgba(37,99,235,.25);
        }

        /* ================= MESSAGE ================= */

        .message {
            display: none;

            padding: 11px 13px;

            border-radius: 9px;

            font-size: 12px;

            margin-bottom: 15px;
        }

        .message.error {
            display: block;

            color: var(--danger);

            background: #fee2e2;
        }

        .message.success {
            display: block;

            color: var(--success);

            background: #dcfce7;
        }

        /* ================= DIVIDER ================= */

        .divider {
            display: flex;

            align-items: center;

            gap: 12px;

            margin: 25px 0;

            color: var(--muted);

            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: "";

            flex: 1;

            height: 1px;

            background:
                var(--border);
        }

        /* ================= SIGNUP ================= */

        .signup-text {
            text-align: center;

            color: var(--muted);

            font-size: 13px;
        }

        .signup-text a {
            color: var(--primary);

            font-weight: 800;

            text-decoration: none;
        }

        /* ================= FOOTER ================= */

        footer {
            text-align: center;

            padding: 20px;

            color: var(--muted);

            font-size: 12px;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 500px) {

            header {
                height: 65px;
            }

            .navbar {
                padding: 0 15px;
            }

            .logo-icon {
                width: 38px;
                height: 38px;
            }

            main {
                padding:
                    25px 12px;
            }

            .login-card {
                padding:
                    32px 20px;

                border-radius: 18px;
            }

            .login-heading h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header>

    <nav class="navbar">

        <a
            href="index.html"
            class="logo"
        >

            <div class="logo-icon">
                SH
            </div>

            <div class="logo-name">

                SCHOOL
                <span>HUB</span>

                <small>
                    Vs Amexo
                </small>

            </div>

        </a>


        <a
            href="index.html"
            class="home-link"
        >
            ← Back to Home
        </a>

    </nav>

</header>


<!-- ================= MAIN ================= -->

<main>

    <div class="login-card">

        <div class="login-heading">

            <div class="login-icon">
                🔐
            </div>

            <h1>
                Welcome Back
            </h1>

            <p>
                Login to continue your learning journey.
            </p>

        </div>


        <div
            id="message"
            class="message"
        ></div>


        <!-- ================= FORM ================= -->

        <form id="loginForm">

            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">
                        ✉️
                    </span>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">
                        🔒
                    </span>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        onclick="togglePassword()"
                    >
                        👁
                    </button>

                </div>

            </div>


            <!-- OPTIONS -->

            <div class="options">

                <label class="remember">

                    <input
                        type="checkbox"
                        id="remember"
                    >

                    Remember me

                </label>


                <a
                    href="#"
                    class="forgot"
                    onclick="forgotPassword()"
                >
                    Forgot password?
                </a>

            </div>


            <!-- LOGIN -->

            <button
                type="submit"
                class="login-btn"
            >
                Login to SCHOOL HUB →
            </button>

        </form>


        <div class="divider">
            OR
        </div>


        <div class="signup-text">

            Don't have an account?

            <a href="signup.html">
                Create Account
            </a>

        </div>

    </div>

</main>


<!-- ================= FOOTER ================= -->

<footer>

    © 2026 SCHOOL HUB Vs Amexo.
    Learn • Practice • Achieve.

</footer>


<script>

    /* ================= PASSWORD ================= */

    function togglePassword() {

        const password =
            document.getElementById(
                "password"
            );

        const button =
            document.querySelector(
                ".password-toggle"
            );


        if (
            password.type ===
            "password"
        ) {

            password.type = "text";

            button.textContent = "🙈";

        } else {

            password.type = "password";

            button.textContent = "👁";

        }

    }


    /* ================= MESSAGE ================= */

    function showMessage(
        text,
        type
    ) {

        const message =
            document.getElementById(
                "message"
            );

        message.textContent =
            text;

        message.className =
            "message " + type;

    }


    /* ================= LOGIN ================= */

    const loginForm =
        document.getElementById(
            "loginForm"
        );


    loginForm.addEventListener(
        "submit",
        function(event) {

            event.preventDefault();


            const email =
                document
                .getElementById("email")
                .value
                .trim();


            const password =
                document
                .getElementById("password")
                .value;


            const remember =
                document
                .getElementById("remember")
                .checked;


            /* GET USERS */

            const users =
                JSON.parse(
                    localStorage.getItem(
                        "schoolHubUsers"
                    )
                ) || [];


            /* FIND USER */

            const user =
                users.find(
                    u =>
                    u.email
                    .toLowerCase() ===
                    email.toLowerCase()
                    &&
                    u.password ===
                    password
                );


            /* WRONG LOGIN */

            if (!user) {

                showMessage(
                    "Incorrect email or password. Please try again.",
                    "error"
                );

                return;

            }


            /* SAVE SESSION */

            localStorage.setItem(
                "schoolHubCurrentUser",
                JSON.stringify(user)
            );


            /* REMEMBER */

            if (remember) {

                localStorage.setItem(
                    "schoolHubRemember",
                    "true"
                );

            } else {

                localStorage.removeItem(
                    "schoolHubRemember"
                );

            }


            showMessage(
                "Login successful! Opening your dashboard...",
                "success"
            );


            /* REDIRECT */

            setTimeout(
                function() {

                    window.location.href =
                        "dashboard.html";

                },
                900
            );

        }
    );


    /* ================= FORGOT PASSWORD ================= */

    function forgotPassword() {

        alert(
            "Password recovery will be connected to the backend authentication system in the next version."
        );

    }


    /* ================= AUTO LOGIN ================= */

    window.addEventListener(
        "load",
        function() {

            const savedUser =
                localStorage.getItem(
                    "schoolHubCurrentUser"
                );


            const remembered =
                localStorage.getItem(
                    "schoolHubRemember"
                );


            if (
                savedUser &&
                remembered === "true"
            ) {

                window.location.href =
                    "dashboard.html";

            }

        }
    );

</script>

</body>
</html>
